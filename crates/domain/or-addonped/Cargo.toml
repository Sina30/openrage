[package]
name = "or-addonped"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The addon ped engine: streamed ped models and the data that defines them as content of a project, with their rules, the plan they contribute and the verifier, with no UI"

[dependencies]
# The readers a ped's files are opened with, and the metadata reader the data file is checked with.
or-io = { workspace = true, features = ["meta"] }
# The contract through which content reaches a plan.
or-project.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The digest of a ped's content, which the diff of two builds compares.
sha2 = "0.10"

[dev-dependencies]
tempfile.workspace = true
# The shared corpus: staged ped models, drawables and expressions for the checks.
or-test-support.workspace = true
