[package]
name = "xtask"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Repository tasks (formatting, lints, the pre-commit hook, test tiers) that run the same on every OS"

# No workspace crate: the pre-commit hook runs this binary, and a commit must
# never wait on the workspace compiling.
[dependencies]
anyhow.workspace = true
regex.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
