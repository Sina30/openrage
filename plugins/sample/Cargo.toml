[package]
name = "or-plugin-sample"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A sample guest: doubles every f32 field of the document root, or with `bytes` round-trips a .ydd through or-io, or with `surface` adds a panel, a command, a setting and an overlay, or with `extend` validates and emits for a build"

[lib]
crate-type = ["cdylib"]

[features]
# The entry reads the file's bytes, parses them with `or-io` inside the guest
# and writes them back, which links `or-io` for wasm32.
bytes = ["dep:or-io"]
# The exports register a panel, a command and a setting, and draw an overlay, in place of `go`.
surface = []
# The exports `validate` and `emit` read the plan of a build, report on it and add a file to it, in place of `go`.
extend = ["dep:serde_json"]
# The export `validate` reads the clothing packs of a build and suggests a fix with a finding (ABI 1).
fixes = ["dep:serde_json"]
# The export `go` writes two files of the project together (ABI 1), in place of the sample's own.
writes = []

[dependencies]
or-plugin-guest = { path = "../guest" }
serde_json = { version = "1", optional = true }
or-io = { path = "../../crates/io/or-io", default-features = false, features = ["gta5"], optional = true }
