[package]
name = "or-plugin-cloth-painter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The cloth painter: per-vertex weight, inflation scale, pin radius, pinning and force of a .yld, painted in a panel with an overlay in the viewport"

[lib]
crate-type = ["cdylib"]

[dependencies]
or-plugin-guest = { path = "../guest" }
or-io = { path = "../../crates/io/or-io", default-features = false, features = ["gta5"] }
